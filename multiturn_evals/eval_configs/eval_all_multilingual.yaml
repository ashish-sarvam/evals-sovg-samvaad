# =============================================================================
# COMPREHENSIVE EVAL CONFIG
# ALL tasks × ALL agents × ALL users × ALL languages (EXPLICIT)
# =============================================================================
# Run with: python run_evals.py --config eval_configs/eval_all_multilingual.yaml
# =============================================================================

model:
  provider: gemini
  temperature: 0.5
  max_tokens: 1024

settings:
  max_turns: 3
  parallel_workers: 100
  output_dir: results/comprehensive
  skip_verification: false
  verbose: true

evals:
  # ===========================================================================
  # TASK: multilingual
  # Tests: Agent responds in NATIVE SCRIPT
  # ===========================================================================
  
  - task: multilingual
    agent: dcs
    users: [cooperative, correcting, busy, confused]
    languages: [hi-en, bn-en, ta-en, te-en, kn-en, ml-en, mr-en, gu-en, pa-en, or-en]

  - task: multilingual
    agent: idfc_main
    users: [cooperative, correcting, confused]
    languages: [hi-en, bn-en, ta-en, te-en, kn-en, ml-en, mr-en, gu-en, pa-en, or-en]

